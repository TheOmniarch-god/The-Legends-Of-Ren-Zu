<!-- Paste this in Supabase Dashboard -> Authentication -> Email Templates -> Confirm signup / Magic Link.
Subject suggestion: Your Gate of Fate Login Code
This is for LOGIN confirmation, not paid Realm Token emails. Paid Realm Token emails are sent by lib/api/flutterwave-webhook.js through Resend. -->
<div style="margin:0;padding:0;background:#050403;font-family:Georgia,'Times New Roman',serif;color:#f7ead0;">
  <div style="max-width:620px;margin:0 auto;padding:30px 16px;">
    <div style="border:1px solid rgba(255,220,150,0.30);border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#17100a 0%,#080604 100%);">
      <div style="text-align:center;background:#050403;border-bottom:1px solid rgba(255,220,150,0.18);">
        <img src="https://thelegendsofrenzu.theomniarch.com.ng/assets/email-omniarch-logo.jpg" alt="The Omniarch" width="620" style="display:block;width:100%;max-width:620px;height:auto;border:0;" />
      </div>
      <div style="padding:28px;">
        <div style="font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,230,180,.62);margin-bottom:10px;">The Legends of Ren Zu</div>
        <div style="font-size:28px;line-height:1.15;font-weight:bold;color:#fff4d6;">Gate of Fate Login</div>
        <p style="font-size:15px;line-height:1.7;color:rgba(247,234,208,.78);">Use this code to complete your Login:</p>
        <div style="text-align:center;font-size:30px;letter-spacing:.18em;font-weight:bold;color:#fff4d6;padding:18px 16px;margin:20px 0;border-radius:18px;border:1px solid rgba(255,220,150,.35);background:rgba(255,220,150,.10);">{{ .Token }}</div>
        <p style="font-size:13px;line-height:1.65;color:rgba(247,234,208,.66);">If your email client does not support codes, use this link:</p>
        <div style="text-align:center;margin:22px 0;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 22px;border-radius:999px;background:rgba(255,220,150,.18);border:1px solid rgba(255,220,150,.38);color:#fff4d6;text-decoration:none;font-size:14px;letter-spacing:.08em;">Open Gate of Fate</a></div>
        <p style="font-size:12px;line-height:1.6;color:rgba(247,234,208,.45);margin:22px 0 0;">If you did not request this Login, ignore this email.</p>
      </div>
    </div>
    <div style="text-align:center;margin-top:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(247,234,208,.35);">The Omniarch</div>
  </div>
</div>
